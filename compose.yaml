services:
  app:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: "no"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/saude', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
